[package]
name = "bevy-gym-drone-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
bevy = { version = "0.18", default-features = false }
bevy-gym = { path = "..", default-features = false, features = ["robots", "browser", "browser-training"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }

[[bin]]
name = "drone-worker"
path = "src/main.rs"
