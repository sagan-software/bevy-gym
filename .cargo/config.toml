[target.wasm32-unknown-emscripten]
rustflags = [
  # Uncomment these to enable multi-threading support
  # "-Clink-args=-pthread",                              # /!\ Read 'Thread support' below regarding this flag
  # "-Ctarget-feature=+atomics",                         # /!\ Read 'Thread support' below regarding this flag
  "-Clink-args=-sSIDE_MODULE=2",
  "-Zlink-native-libraries=no",
  "-Cllvm-args=-enable-emscripten-cxx-exceptions=0",
  # "-Zbuild-std",
]

# Bevy fast-compile guidance:
# https://bevy.org/learn/book/development-practices/fast-compiles/
#
# Stable, cross-platform defaults are kept active here. Toolchain- or
# machine-specific options are left commented so this config works for a fresh
# checkout.

[target.x86_64-unknown-linux-gnu]
rustflags = [
  # Rust 1.90+ uses LLVM lld by default on this target.
  # For Mold, install mold and uncomment the next line:
  # "-Clink-arg=-fuse-ld=mold",
]
rustdocflags = [
  # Some systems see doc-test linker issues; enable only with Mold installed.
  # "-Clink-arg=-fuse-ld=mold",
]

[target.x86_64-apple-darwin]
rustflags = [
  # Bevy recommends the default macOS ld64 linker over LLD.
  # Nightly-only fast compile flags:
  # "-Zshare-generics=y",
  # "-Zthreads=0",
]

[target.aarch64-apple-darwin]
rustflags = [
  # Bevy recommends the default macOS ld64 linker over LLD.
  # Nightly-only fast compile flags:
  # "-Zshare-generics=y",
  # "-Zthreads=0",
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = [
  # Nightly-only fast compile flags:
  # "-Zshare-generics=n",
  # "-Zthreads=0",
]
