name: Browser preview

on:
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "flake.*"
      - "src/**"
      - "examples/ecosystem/shared/**"
      - "web/**"
      - "gymnasium-web/**"
      - "robot-web/**"
      - "gallery/**"
      - "examples/robots/**"
      - "assets/robots/**"
      - "assets/fonts/**"
      - "LICENSES/**"
      - "scripts/build_drone_viewer.sh"
      - "tests/test_browser_assets.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  NO_COLOR: "true"
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix run .#browser-runtime-check
        env:
          DEBUG: pw:browser
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cmd-format: "nix develop --command {0}"
          key: ${{ hashFiles('flake.lock') }}
          cache-bin: false
          cache-on-failure: true
      - run: nix develop --command cargo test -p bevy-gym-web --locked
      - run: nix develop --command cargo test -p bevy-gym-browser --locked
      - run: nix run .#web-check
      - run: nix develop --command trunk build --config web/Trunk.toml --release --locked --public-url /bevy-gym/ecosystem/
      - run: nix run .#gymnasium-check
        env:
          DEBUG: pw:browser
      - run: nix develop --command scripts/build_drone_viewer.sh --release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-qualification
          path: test-results/gymnasium
          retention-days: 14
      - run: mkdir -p site/ecosystem && cp -a dist/. site/ecosystem/
      - run: mkdir -p site/robots/hover site/examples && cp -a robot-web/dist-release/. site/robots/hover/ && cp -a gallery/. site/examples/
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
