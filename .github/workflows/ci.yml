name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/fixtures/gymnasium/test_contracts.py
      - run: nix develop --command python3 tests/test_gymnasium_dependencies.py
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo test
      - run: nix develop --command cargo test -p bevy-gym-web --locked
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings
