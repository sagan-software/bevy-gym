name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cmd-format: "nix develop --command {0}"
          key: ${{ hashFiles('flake.lock') }}
          cache-bin: false
          cache-on-failure: true
      - run: python3 tests/fixtures/gymnasium/test_contracts.py
      - run: nix develop --command python3 tests/test_gymnasium_dependencies.py
      - run: nix develop --command python3 tests/test_drone_audio.py
      - run: nix develop --command python3 tests/test_survival_assets.py
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo test
      - run: nix develop --command cargo test --no-default-features --features robots --lib --test pursuit_arena --test pursuit_combat --test pursuit_shots --test pursuit_sight --test pursuit_hearing --test pursuit_return_fire --test pursuit_navigation --test drone_hover --test drone_damage --test drone_recovery --test drone_tracking --test drone_parity --test drone_learning --test drone_skill_session --test droid_standing --test droid_learning --test droid_skill_session --test droid_projection
      - run: nix develop --command cargo build --no-default-features --features robots --example drone-hover --example drone-recovery --example drone-curriculum --example droid-standing
      - run: nix develop --command env DROID_STANDING_BIN=target/debug/examples/droid-standing python3 tests/test_droid_standing_cli.py
      - run: nix develop --command python3 tests/test_drone_skill_cli.py
      - run: nix develop --command python3 tests/test_drone_curriculum_cli.py
      - run: nix develop --command cargo test --features robots --example drone-flight
      - run: nix develop --command cargo test --features robots --example drone-hover-scene --example drone-recovery-scene --example drone-travel-scene --example droid-standing-scene
      - run: nix develop --command cargo test -p bevy-gym-pursuit-viewer --example drone-pursuit
      - run: nix develop --command cargo run --no-default-features --features robots --example pursuit-search
      - run: nix develop --command cargo check --no-default-features --features robots,browser --target wasm32-unknown-unknown
      - run: nix run .#drone-browser-check
      - run: nix develop --command cargo test -p bevy-gym-web --locked
      - run: nix develop --command cargo test -p bevy-gym-browser --locked
      - run: nix develop --command cargo test -p bevy-gym-drone-worker --locked
      - run: nix develop --command node --test robot-web/tests/*.test.mjs
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cmd-format: "nix develop --command {0}"
          key: ${{ hashFiles('flake.lock') }}
          cache-bin: false
          cache-on-failure: true
      - run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-browser --all-targets -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-browser --target wasm32-unknown-unknown -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-drone-worker --all-targets --all-features -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-drone-worker --target wasm32-unknown-unknown --all-features -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-pursuit-viewer --all-targets --all-features -- -D warnings
      - run: nix develop --command cargo clippy -p bevy-gym-pursuit-viewer --example drone-pursuit --no-default-features --features browser,bevy/webgl2 --target wasm32-unknown-unknown -- -D warnings
