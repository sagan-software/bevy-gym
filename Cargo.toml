[package]
name = "bevy-gym"
version = "0.3.3"
edition = "2021"
description = "Bevy ECS plugin for parallelised RL environment simulation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagan-software/bevy-gym"
keywords = ["bevy", "gym", "ecs", "simulation", "rl"]
categories = ["game-engines", "science"]

[workspace]
members = ["web", "gymnasium-web", "robot-web"]
default-members = ["."]
resolver = "2"

[lints]
workspace = true

[features]
default = ["render"]
# Deterministic rigid-body drone environments for native and browser lessons.
robots = ["dep:rapier3d"]
# Opt into JavaScript entropy for browser applications, without forcing it on WASI.
browser = ["dep:getrandom", "dep:wasm-bindgen"]
# Enables CPU autodiff in browser workers without native run-file orchestration.
browser-training = ["burn/autodiff"]
# Portable ecosystem simulation and read-only visual projection used by WASM inference.
ecosystem-inference = ["dep:avian2d"]
# Local iteration only. Bevy dynamic linking is the largest rebuild-time win,
# but should not be enabled for published or shipping builds.
fast-compile = ["bevy/dynamic_linking"]
# Portable rendering for native and browser examples.
render-core = [
  "bevy/2d_bevy_render",
  "bevy/3d_bevy_render",
  "bevy/default_app",
  "bevy/default_font",
  "bevy/bevy_gizmos",
  "bevy/bevy_mikktspace",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/bevy_winit",
  "bevy/ui_picking",
]
# Native examples also include remote inspection and desktop window backends.
render = [
  "render-core",
  "bevy/bevy_remote",
  "bevy/wayland",
  "bevy/x11",
  "dep:bevy-inspector-egui",
]
bevy-mcp = ["render", "dep:bevy_brp_extras"]
# Name expected by Bevy BRP MCP launch tooling.
bevy_remote = ["bevy-mcp"]
# MuJoCo 3.9-backed environments remain optional because they require the
# native MuJoCo runtime. `nix develop` supplies the exact runtime automatically.
mujoco = ["dep:mujoco-rs"]

# Minimal Bevy — only what's needed for ECS + scheduling.
[dependencies.bevy]
default-features = false
features = ["bevy_log"]
version = "0.18"

[dependencies.burn]
default-features = false
features = ["std", "flex"]
version = "0.21"

[dependencies.avian2d]
default-features = false
features = ["2d", "f32", "parry-f32"]
optional = true
version = "0.6.1"

[dependencies.rapier3d]
features = ["enhanced-determinism"]
optional = true
version = "0.36.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bevy]
default-features = false
features = ["multi_threaded"]
version = "0.18"

# Keep ecosystem parallel physics native-only and opt-in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.avian2d]
default-features = false
features = ["parallel"]
optional = true
version = "0.6.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.burn]
default-features = false
features = ["autodiff"]
version = "0.21"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.clap]
features = ["derive"]
version = "4.5.54"

# getrandom 0.4 requires applications to choose a browser backend explicitly.
# https://docs.rs/getrandom/0.4.2/#webassembly-support
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
features = ["wasm_js"]
optional = true
version = "0.4.2"

[dependencies.mujoco-rs]
default-features = false
optional = true
version = "=5.0.0"

[dependencies.bevy_brp_extras]
default-features = true
optional = true
version = "0.18"

[dependencies.bevy-inspector-egui]
default-features = false
features = ["bevy_render"]
optional = true
version = "0.36"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.serde_json]
version = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "=0.2.121"
optional = true

# Match the locked wasm-bindgen 0.2.121 runner used by the Nix environment.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies.wasm-bindgen-test]
version = "=0.3.71"

[dependencies.shakmaty]
version = "0.30.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
features = ["fs", "io-util", "process", "rt"]
version = "1"

